<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About | My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
        }

        nav {
            width: 100%;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #00eaff;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 35px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #00eaff;
        }

        .about {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .card {
            max-width: 800px;
            padding: 60px;
            text-align: center;

            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;

            background: rgba(255, 255, 255, 0.1);

            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);

            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 55px;
            margin-bottom: 25px;
            color: #00eaff;
            text-shadow: 0 0 20px #00eaff;
        }

        p {
            font-size: 20px;
            line-height: 1.8;
            color: #dcdcff;
        }

        .skills {
            margin-top: 35px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .skill {
            padding: 12px 20px;
            border-radius: 25px;
            background: linear-gradient(90deg, #00eaff, #7b2ff7);
            font-weight: bold;
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">MyWebsite</div>

       <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="contact.html">Contact</a></li>
</ul>
    </nav>

    <section class="about">

        <div class="card">

            <h1>About Me 👨‍💻</h1>

            <p>
                Hello! I am a passionate learner and web developer.
                I enjoy creating beautiful websites and learning
                new technologies.
            </p>

            <div class="skills">
                <div class="skill">HTML</div>
                <div class="skill">CSS</div>
                <div class="skill">JavaScript</div>
                <div class="skill">React</div>
            </div>

        </div>

    </section>

</body>
</html>
