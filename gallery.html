<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gallery | My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
        }

        nav {
            width: 100%;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #00eaff;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 35px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #00eaff;
        }

        .gallery {
            padding: 60px 8%;
            text-align: center;
        }

        .gallery h1 {
            font-size: 55px;
            color: #00eaff;
            text-shadow: 0 0 20px #00eaff;
            margin-bottom: 15px;
        }

        .gallery p {
            color: #dcdcff;
            font-size: 19px;
            margin-bottom: 45px;
        }

        .gallery-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            max-width: 1100px;
            margin: auto;
        }

        .gallery-card {
            height: 250px;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);

            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);

            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
            transition: 0.4s;
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: 0.4s;
        }

        .gallery-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 0 30px rgba(0, 234, 255, 0.4);
        }

        .gallery-card:hover img {
            transform: scale(1.1);
        }

        @media (max-width: 800px) {
            nav {
                padding: 20px;
            }

            nav ul {
                gap: 15px;
            }

            nav ul li a {
                font-size: 15px;
            }

            .gallery-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .gallery-container {
                grid-template-columns: 1fr;
            }

            .gallery h1 {
                font-size: 40px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">MyWebsite</div>

        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <section class="gallery">

        <h1>My Gallery 📸</h1>

        <p>
            A collection of beautiful moments and memories ✨
        </p>

        <div class="gallery-container">

            <div class="gallery-card">
                <img src="https://picsum.photos/600/400?random=1" alt="Gallery Image 1">
            </div>

            <div class="gallery-card">
                <img src="https://picsum.photos/600/400?random=2" alt="Gallery Image 2">
            </div>

            <div class="gallery-card">
                <img src="https://picsum.photos/600/400?random=3" alt="Gallery Image 3">
            </div>

            <div class="gallery-card">
                <img src="https://picsum.photos/600/400?random=4" alt="Gallery Image 4">
            </div>

            <div class="gallery-card">
                <img src="https://picsum.photos/600/400?random=5" alt="Gallery Image 5">
            </div>

            <div class="gallery-card">
                <img src="https://picsum.photos/600/400?random=6" alt="Gallery Image 6">
            </div>

        </div>

    </section>

</body>
</html>
