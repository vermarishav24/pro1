<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: white;
        }

        nav {
            width: 100%;
            padding: 20px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #00eaff;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 35px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

        nav ul li a:hover {
            color: #00eaff;
        }

        .hero {
            min-height: calc(100vh - 80px);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            padding: 60px 80px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);

            -webkit-backdrop-filter: blur(15px);
            backdrop-filter: blur(15px);

            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 70px;
            margin-bottom: 20px;
            text-shadow: 0 0 25px #00eaff;
        }

        p {
            font-size: 22px;
            color: #dcdcff;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 30px;
            border-radius: 30px;
            background: linear-gradient(90deg, #00eaff, #7b2ff7);
            color: white;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 25px #00eaff;
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">MyWebsite</div>

    <ul>
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="contact.html">Contact</a></li>
    </ul>
    </nav>

    <section class="hero">

        <div class="container">
            <h1>Hello World! 👋</h1>

            <p>
                Welcome to my beautiful website ✨
            </p>

            <a href="about.html" class="btn">
                Learn More 🚀
            </a>
        </div>

    </section>

</body>
</html>
